[project]
name = "dreamstation"
version = "0.1.0"
description = "Read therapy data from a Philips DreamStation CPAP SD card: sessions, settings, events and nightly statistics, no vendor software required."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Matt Joyce" }]
keywords = ["cpap", "dreamstation", "philips", "respironics", "sleep-apnoea", "prs1", "sd-card"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.scripts]
dreamstation = "dreamstation.cli:main"

[project.urls]
Homepage = "https://github.com/mattjoyce/dreamstation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamstation"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
